<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>管理员后台</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="lottery-box">
  <div class="main-title">官方开奖管控中心</div>
  <div style="text-align:center;color:#94a3b8;margin-bottom:20px">管理员专属后台</div>

  <div class="sub-title">手动设定本期开奖总和</div>
  <input type="number" id="sumInput" placeholder="数值范围 0 - 27">
  <button class="btn btn-red" onclick="setSum()">确认下发开奖数据</button>
  <div class="tip-text" id="adminTip"></div>

  <div class="sub-title">玩家积分手动管控</div>
  <div style="display:flex;gap:8px;margin:10px 0;flex-wrap:wrap">
    <input type="text" id="targetAccount" placeholder="输入玩家账号" style="flex:1">
    <input type="number" id="changeScore" placeholder="增减积分数值" style="flex:1">
  </div>
  <div class="flex-row">
    <button class="btn btn-blue" style="flex:1" onclick="addScore()">增加积分</button>
    <button class="btn btn-gray" style="flex:1" onclick="reduceScore()">扣除积分</button>
  </div>
  <div class="tip-text" id="scoreTip"></div>

  <div class="sub-title">玩家积分申请审核列表</div>
  <button class="btn btn-green" onclick="refreshApplyList()">刷新申请列表</button>
  <table>
    <thead>
      <tr>
        <th>账号</th>
        <th>昵称</th>
        <th>申请类型</th>
        <th>积分</th>
        <th>时间</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody id="applyTable"></tbody>
  </table>

  <div class="sub-title">全网玩家数据统计</div>
  <button class="btn btn-green" onclick="refreshUser()">一键刷新玩家列表</button>
  <table>
    <thead>
      <tr>
        <th>昵称</th>
        <th>账号</th>
        <th>当前积分</th>
      </tr>
    </thead>
    <tbody id="userTable"></tbody>
  </table>

  <div style="margin-top:20px">
    <button class="btn btn-green" onclick="location.href='cheat-log.html'">查看作弊日志记录</button>
  </div>
</div>
<script type="module" src="js/admin.js"></script>
</body>
</html>
