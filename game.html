<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>开奖投注大厅</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="lottery-box">
  <div class="main-title">数字开奖竞猜</div>

  <div class="user-info-bar">
    <span>玩家昵称：<span id="nickname"></span></span>
    <span>账户积分：<span class="score-num" id="score"></span></span>
    <span>剩余期数：<span class="time-count" id="time">60</span>秒</span>
  </div>

  <div class="num-ball-wrap">
    <div class="num-ball" id="n1">?</div>
    <div class="num-ball" id="n2">?</div>
    <div class="num-ball" id="n3">?</div>
  </div>
  <div class="calc-info" id="calcStr">等待本期开奖</div>

  <div class="sub-title">本期投注选项</div>
  <div class="flex-row">
    <div class="bet-card">
      <div class="bet-name">大</div>
      <input type="number" id="big" value="0">
      <div class="rate-text">赔率 2.6倍</div>
    </div>
    <div class="bet-card">
      <div class="bet-name">小</div>
      <input type="number" id="small" value="0">
      <div class="rate-text">赔率 2.6倍</div>
    </div>
    <div class="bet-card">
      <div class="bet-name">单</div>
      <input type="number" id="odd" value="0">
      <div class="rate-text">赔率 2.6倍</div>
    </div>
    <div class="bet-card">
      <div class="bet-name">双</div>
      <input type="number" id="even" value="0">
      <div class="rate-text">赔率 2.6倍</div>
    </div>
  </div>

  <div class="flex-row">
    <div class="bet-card">
      <div class="bet-name">大单</div>
      <input type="number" id="bigOdd" value="0">
      <div class="rate-text">赔率 5.2倍</div>
    </div>
    <div class="bet-card">
      <div class="bet-name">大双</div>
      <input type="number" id="bigEven" value="0">
      <div class="rate-text">赔率 6倍</div>
    </div>
    <div class="bet-card">
      <div class="bet-name">小单</div>
      <input type="number" id="smallOdd" value="0">
      <div class="rate-text">赔率 6倍</div>
    </div>
    <div class="bet-card">
      <div class="bet-name">小双</div>
      <input type="number" id="smallEven" value="0">
      <div class="rate-text">赔率 5.2倍</div>
    </div>
  </div>

  <div class="flex-row">
    <button class="btn btn-red" style="flex:1" onclick="submitBet()">确认投注</button>
    <button class="btn btn-gray" style="flex:1" onclick="cancelBet()">撤销投注</button>
  </div>
  <div class="flex-row">
    <button class="btn btn-blue" style="flex:1" onclick="showRecord()">历史开奖</button>
  </div>
  <div class="tip-text" id="msgTip"></div>

  <div class="sub-title">全场玩家实时下注</div>
  <table>
    <thead>
      <tr>
        <th>玩家</th>
        <th>大</th>
        <th>小</th>
        <th>单</th>
        <th>双</th>
        <th>大单</th>
        <th>大双</th>
        <th>小单</th>
        <th>小双</th>
      </tr>
    </thead>
    <tbody id="publicBetBody"></tbody>
  </table>

  <div class="sub-title">积分申请（管理员审核）</div>
  <input type="number" id="applyScoreNum" placeholder="输入申请积分数量" min="1">
  <div class="flex-row">
    <button class="btn btn-green" style="flex:1" onclick="applyAddScore()">申请加分</button>
    <button class="btn btn-red" style="flex:1" onclick="apply回分扣分">申请回分扣分</button>
  </div>
  <div class="tip-text" id="applyTip"></div>
</div>
<script type="module" src="js/game.js"></script>
</body>
</html>
